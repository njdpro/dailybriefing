name: Daily Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"  # 6 AM CDT / 11:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check generate.js
        run: |
          nl -ba generate.js | head -30
          node --check generate.js
  
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Daily update" || echo "No changes"
          git push
